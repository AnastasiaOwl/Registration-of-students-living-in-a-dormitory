<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>enterStudent</title>
    <link th:rel="stylesheet"type="text/css" th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}">
    <link th:rel ="stylesheet"type="text/css" th:href="style.css">
</head>
<body>
<div class="mycontainer">
    <div id="content">
    <ul class="list-unstyled text-center">
    <form action="addStudent" method="post" id="studentForm">
    <label class ="mylable" for="nameResident">name resident:</label>
    <input type="text" name="nameResident" id="nameResident" placeholder="name resident"><br>
    <label class ="mylable" for="nameFaculty">faculty:</label>
    <input type="text" name="nameFaculty" id="nameFaculty" placeholder="faculty"><br>
    <label class ="mylable" for="group">group:</label>
    <input type="text" name="group" id="group" placeholder="group"><br>
    <label class ="mylable" for="year">year:</label>
    <input type="text" name="year" id="year" placeholder="year"><br>
    <label class ="mylable" for="roomNumber">room number:</label>
    <input type="text" name="roomNumber" id="roomNumber" placeholder="room number"><br>
    <label class ="mylable" for="dateSettlement">date settelment:</label>
    <input type="Date" name="dateSettlement" id="dateSettlement" placeholder="date settelment"><br>
    <label class ="mylable" for="dateEviction">date eviction:</label>
    <input type="Date" name="dateEviction" id="dateEviction" placeholder="date eviction"><br>
    <label class ="mylable" for="preferentialCategory"> preferential category:</label>
    <input type="text" name="preferentialCategory" id="preferentialCategory" placeholder="preferential category"><br>
    <label class ="mylable" for="budgetContract"> budget/contract:</label>
    <input type="text" name="budgetContract" id="budgetContract" placeholder="budget/contract"><br>
    <label class ="mylable" for="residenceStatus"> residence status:</label>
    <input type="text" name="residenceStatus" id="residenceStatus" placeholder="residence status:"><br>
    <input type="submit" class="btn btn-outline-dark" value="add student" >
</form>
    </ul>
    </div>
</div>
<div class="modal fade" id="studentErrorModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticWarningLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticWarningLabel">Error</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Please fill in all the fields.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script th:src="@{/webjars/bootstrap/5.2.3/js/bootstrap.min.js}"></script>
<script>
    // JavaScript to trigger the modal when the form is submitted
    $(document).ready(function() {
        $('#studentForm').submit(function(student) {
            // Prevent the default form submission
            student.preventDefault();

            // Check if any of the form fields are empty
            var nameResident = $('#nameResident').val().trim();
            var nameFaculty = $('#nameFaculty').val().trim();
            var group = $('#group').val().trim();
            var year = $('#year').val().trim();
            var roomNumber = $('#roomNumber').val().trim();
            var dateSettlement = $('#dateSettlement').val().trim();
            var dateEviction = $('#dateEviction').val().trim();
            var preferentialCategory = $('#preferentialCategory').val().trim();
            var budgetContract = $('#budgetContract').val().trim();
            var residenceStatus = $('#residenceStatus').val().trim();

            if (nameResident === '' || nameFaculty === '' || group === '' || year === '' || roomNumber === ''
            || dateSettlement === '' || dateEviction === '' || preferentialCategory === '' || budgetContract === ''
            || residenceStatus === ''){
                // If any of the fields are empty, show the modal
                $('#studentErrorModal').modal('show');
            } else {
                // If all fields are filled, submit the form
                $(this).unbind('submit').submit();
            }
        });
    });
</script>
</body>
</html>
