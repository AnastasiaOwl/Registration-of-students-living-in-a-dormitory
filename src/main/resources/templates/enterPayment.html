<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <link th:rel="stylesheet"type="text/css" th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}">
    <link th:rel ="stylesheet"type="text/css" th:href="style.css">
</head>
<body>
<div class="mycontainer">
    <ul class="list-unstyled text-center">
<form action="addPayment" method="post" id="paymentForm">
<label class ="mylable" for="lastPaymentDate"> last payment date:</label>
<input type="date" name="lastPaymentDate" id="lastPaymentDate" placeholder="date of the last payment"><br>
<label class ="mylable" for="fixPaymentDate">fixed date:</label>
<input type="date" name="fixPaymentDate" id="fixPaymentDate" placeholder="fixed date"><br>
<label class ="mylable" for="amountOfLastPayment">last payment amount:</label>
<input type="text" name="amountOfLastPayment" id="amountOfLastPayment" placeholder="last payment amount"><br>
<label class ="mylable" for="totalAmount">total amount:</label>
<input type="text" name="totalAmount" id="totalAmount" placeholder="total amount"><br>
<label class ="mylable" for="fixedAmount">fixed amount:</label>
<input type="text" name="fixedAmount" id="fixedAmount" placeholder="fixed amount"><br>
    <label class="mylable" for="student_id">student id:</label>
    <input type="text" name="student_id" id="student_id" placeholder="student id"><br>
    <input type="submit" class="btn btn-outline-dark" value="add payment"><br>
</form>
    </ul>
</div>
<div class="modal fade" id="paymentErrorModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticWarningLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticWarningLabel">Error</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Please fill in all the fields.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script th:src="@{/webjars/bootstrap/5.2.3/js/bootstrap.min.js}"></script>
<script>
    // JavaScript to trigger the modal when the form is submitted
    $(document).ready(function() {
        $('#paymentForm').submit(function(payment) {
            // Prevent the default form submission
            payment.preventDefault();

            // Check if any of the form fields are empty
            var lastPaymentDate = $('#lastPaymentDate').val().trim();
            var fixPaymentDate = $('#fixPaymentDate').val().trim();
            var amountOfLastPayment = $('#amountOfLastPayment').val().trim();
            var totalAmount = $('#totalAmount').val().trim();
            var fixedAmount = $('#fixedAmount').val().trim();
            var student_id = $('#student_id').val().trim();

            if (lastPaymentDate === '' || fixPaymentDate === '' || amountOfLastPayment === '' || totalAmount === '' || fixedAmount === ''
                || student_id === ''){
                // If any of the fields are empty, show the modal
                $('#paymentErrorModal').modal('show');
            } else {
                // If all fields are filled, submit the form
                $(this).unbind('submit').submit();
            }
        });
    });
</script>
</body>
</html>
